# Boards to poll. One entry per company / search stream.
#
#   ats:   greenhouse | lever | ashby | smartrecruiters | workday | linkedin | naukri | custom
#   slug:  the company's board identifier / query slug
#   name:  whatever you want to see in the digest

companies:
  # ============================================================================
  # Direct Enterprise ATS Boards
  # ============================================================================
  - {ats: greenhouse, slug: thoughtworks, name: Thoughtworks}
  - {ats: workday, slug: pwc, host: pwc.wd3.myworkdayjobs.com, site: Global_Experienced_Careers, name: PwC}
  - {ats: workday, slug: collaborative, host: collaborative.wd1.myworkdayjobs.com, site: collaborative_solutions, name: Cognizant}

  # ============================================================================
  # Market-Wide LinkedIn Searches (All Companies in India - Last 24 Hours)
  # ============================================================================
  - {ats: linkedin, slug: li-dotnet-dev, query: ".NET Developer", location: "India", name: "LinkedIn .NET Developers"}
  - {ats: linkedin, slug: li-csharp-fullstack, query: "C# Full Stack Developer", location: "India", name: "LinkedIn C# Full Stack"}
  - {ats: linkedin, slug: li-aspnet-core, query: "ASP.NET Core Developer", location: "India", name: "LinkedIn ASP.NET Core"}
  - {ats: linkedin, slug: li-genai-dotnet, query: "GenAI .NET Developer", location: "India", name: "LinkedIn GenAI / LLM .NET"}
  - {ats: linkedin, slug: li-dotnet-react, query: ".NET React Developer", location: "India", name: "LinkedIn .NET + React"}

  # ============================================================================
  # Market-Wide Naukri Searches (All Companies in India - 3+ Years Exp - Last 24 Hours)
  # ============================================================================
  - {ats: naukri, slug: nk-dotnet, query: "dot-net-developer", job_age: 1, experience: 3, name: "Naukri .NET Developer (3+ yrs)"}
  - {ats: naukri, slug: nk-csharp, query: "c-sharp-developer", job_age: 1, experience: 3, name: "Naukri C# Developer (3+ yrs)"}
  - {ats: naukri, slug: nk-fullstack, query: "full-stack-dot-net-developer", job_age: 1, experience: 3, name: "Naukri Full Stack .NET (3+ yrs)"}
  - {ats: naukri, slug: nk-aspnetcore, query: "asp-net-core-developer", job_age: 1, experience: 3, name: "Naukri ASP.NET Core (3+ yrs)"}
  - {ats: naukri, slug: nk-dotnetazure, query: "dot-net-azure-developer", job_age: 1, experience: 3, name: "Naukri .NET + Azure (3+ yrs)"}
  - {ats: naukri, slug: nk-net, query: "net", job_age: 1, experience: 3, name: "Naukri Net (3+ yrs)"}
  - {ats: naukri, slug: nk-dotnet-fullstack, query: "dot-net-fullstack-developer", job_age: 1, experience: 3, name: "Naukri Dot Net Fullstack (3+ yrs)"}
  - {ats: naukri, slug: nk-dotnet-only, query: "dotnet-developer", job_age: 1, experience: 3, name: "Naukri Dotnet Developer (3+ yrs)"}
  - {ats: naukri, slug: nk-csharp-only, query: "c-sharp", job_age: 1, experience: 3, name: "Naukri C# (3+ yrs)"}

